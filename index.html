<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%95%8C%3C/text%3E%3C/svg%3E">
<title>العصف الذهني للتوسع الدعوي للمشاريع ١٤٤٨ هـ</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe2;--card:#fffcf4;--ink:#1d2a1b;--mut:#6b7566;--line:#e2dac5;--g:#3b6d2b;--gd:#1c3a16;--gold:#b8923a;--hov:#f3ecd8;--sh:0 1px 2px rgba(40,50,20,.06),0 8px 24px rgba(40,50,20,.07);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f160f;--card:#172117;--ink:#ece8d8;--mut:#9aa595;--line:#2a382a;--g:#6fae58;--gd:#0b1a09;--gold:#d4ae5a;--hov:#1e2b1e;--sh:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f160f;--card:#172117;--ink:#ece8d8;--mut:#9aa595;--line:#2a382a;--g:#6fae58;--gd:#0b1a09;--gold:#d4ae5a;--hov:#1e2b1e;--sh:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,"Segoe UI",Tahoma,sans-serif;font-size:15px}
#app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:28px 20px;color:#efe9d4;
background:linear-gradient(160deg,#234a18,#142c10 70%);
background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px),repeating-linear-gradient(-45deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px),linear-gradient(160deg,#234a18,#142c10 70%)}
.brand{font-family:Amiri,serif;font-size:27px;line-height:1.5;font-weight:700;margin:0 4px 4px}
.sub{font-size:13px;color:#d5c48d;margin:0 4px 26px;padding-bottom:18px;border-bottom:1px solid rgba(212,174,90,.35)}
.lbl{font-size:12px;color:#a9b89f;margin:16px 6px 8px;letter-spacing:.02em}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:none;color:inherit;font:inherit;text-align:right;padding:11px 14px;border-radius:12px;cursor:pointer;transition:.15s}
.nav:hover{background:rgba(255,255,255,.08)}
.nav.on{background:#efe6c9;color:#1c3a16;font-weight:700}
.nav small{font-size:12px;min-width:26px;text-align:center;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.14)}
.nav.on small{background:#1c3a16;color:#efe6c9}
.st{margin-top:auto;font-size:12px;color:#a9b89f;padding:0 6px;display:flex;gap:8px;align-items:center}
.st i{width:8px;height:8px;border-radius:50%;background:#7fc15f;display:inline-block}
.st.off i{background:#d98a4a}
main{padding:40px 48px 64px;max-width:1280px;width:100%}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:28px}
h1{font-family:Amiri,serif;font-size:44px;line-height:1.3;margin:0;color:var(--gd)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h1{color:var(--ink)}}
:root[data-theme="dark"] h1{color:var(--ink)}
.hero p{margin:6px 0 0;color:var(--gold);font-family:Amiri,serif;font-size:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--sh);cursor:pointer;text-align:right;font:inherit;color:inherit;border-top:4px solid var(--c,var(--g));transition:.15s}
.stat:hover{transform:translateY(-2px)}
.stat b{display:block;font-family:Amiri,serif;font-size:42px;line-height:1.1;color:var(--c,var(--g))}
.stat span{font-size:13px;color:var(--mut);line-height:1.5;display:block;margin-top:4px}
.stat.tot{background:linear-gradient(150deg,#2f5a22,#1c3a16);border-color:transparent;color:#efe6c9}
.stat.tot b{color:#f1d58a}.stat.tot span{color:#c9d6bd}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:8px 16px;border-radius:99px;cursor:pointer;transition:.15s}
.pill:hover{background:var(--hov)}
.pill.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
.search{margin-inline-start:auto;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:8px 16px;border-radius:99px;width:240px}
.search:focus,.cell:focus{outline:2px solid var(--gold);outline-offset:0}
.tw{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:var(--g);color:#fff;font-family:Amiri,serif;font-size:20px;font-weight:700;padding:14px 16px;text-align:center}
:root[data-theme="dark"] th{color:#0b1a09}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) th{color:#0b1a09}}
td{padding:12px 16px;border-top:1px solid var(--line);vertical-align:top;line-height:1.7}
tbody tr:hover{background:var(--hov)}
td.n{text-align:center;color:var(--mut);width:56px;font-family:Amiri,serif;font-size:18px}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);white-space:nowrap}
.chip{display:inline-block;padding:2px 12px;border-radius:8px;background:var(--hov);font-size:13px}
.lnk{color:var(--g);font-weight:600;text-decoration:none;border-bottom:1px dashed currentColor}
.cell{width:100%;border:1px solid transparent;background:transparent;color:inherit;font:inherit;padding:8px 10px;border-radius:10px;resize:none;field-sizing:content;min-height:40px;line-height:1.7}
.cell:hover{border-color:var(--line);background:var(--bg)}
.cell:focus{background:var(--bg)}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font:inherit;font-size:13px;padding:6px 10px;border-radius:8px}
.x:hover,.x.arm{background:#c4552e;color:#fff}
.add{margin-top:18px;border:2px dashed var(--g);background:none;color:var(--g);font:inherit;font-weight:700;padding:14px;border-radius:16px;width:100%;cursor:pointer;transition:.15s}
.add:hover{background:var(--g);color:#fff}
.empty{text-align:center;color:var(--mut);padding:56px 20px;font-family:Amiri,serif;font-size:22px}
.dh{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.dh h2{font-family:Amiri,serif;font-size:36px;margin:0}
.dn{font-family:Amiri,serif;font-size:36px;font-weight:700;padding:4px 12px;width:auto;min-width:260px;border-color:var(--line)}
.hint{color:var(--mut);font-size:13.5px;margin:0 0 22px}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
const ALL='all';
const DEF=[{id:'d1',name:'مؤسسة الرسالة للخدمات الإنسانية',c:'#3b6d2b'},{id:'d2',name:'جامعة السنة الإسلامية',c:'#b8923a'},{id:'d3',name:'معهد التبيان',c:'#2f7f86'},{id:'d4',name:'الدور السالفية',c:'#b5573a'}];
const PAL=['#3b6d2b','#b8923a','#2f7f86','#b5573a','#7a5aa6','#3f6fb0','#a8497a','#6b7a2a'];
let depts=DEF.map(x=>({...x})),rows=[],view=ALL,flt=ALL,q='',status='جارٍ الاتصال…',off=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dn=id=>(depts.find(d=>d.id===id)||{}).name||'—';
const cc=id=>(depts.find(d=>d.id===id)||{}).c||PAL[0];
const cnt=id=>rows.filter(r=>r.dept===id&&(r.text||'').trim()).length;
const tot=()=>depts.reduce((a,d)=>a+cnt(d.id),0);
const safe=u=>/^https?:\/\//i.test(u||'')?u:'';
const sp=(a,b)=>`<button class="nav" data-newdept style="justify-content:center;border:1px dashed rgba(255,255,255,.35);margin-top:10px">+ إضافة قسم</button>`;

function side(){
 const nav=(v,t,n)=>`<button class="nav ${view===v?'on':''}" data-view="${esc(v)}"><span>${esc(t)}</span><small>${n}</small></button>`;
 return `<aside><h2 class="brand">العصف الذهني للتوسع الدعوي</h2><div class="sub">تحت المجلس الإشرافي · ١٤٤٨ هـ</div>
 <div style="flex:1;min-height:0;overflow-y:auto">${nav(ALL,'لوحة المتابعة',tot())}<div class="lbl">إدخال المشاريع حسب القسم</div>${depts.map(d=>nav(d.id,d.name,cnt(d.id))).join('')}${sp()}</div>
 <div style="margin-top:14px">${GH?`<button class="nav" data-tok="1" style="justify-content:center;border:1px solid rgba(255,255,255,.25)">${TOKEN?'تسجيل الخروج':'تسجيل الدخول للتحرير'}</button>`:''}<div class="st ${off?'off':''}" style="margin-top:14px"><i></i><span id="stt">${status}</span></div></div></aside>`;
}
function rowsDash(){
 const k=q.trim();
 const l=rows.filter(r=>(r.text||'').trim()&&(flt===ALL||r.dept===flt)&&(!k||((r.text||'')+(r.note||'')+(r.criteria||'')).includes(k)));
 if(!l.length)return `<tr><td colspan="6" class="empty">لا توجد مشاريع بعد</td></tr>`;
 return l.map((r,i)=>`<tr><td class="n">${i+1}</td><td>${esc(r.text)}</td><td>${r.note?`<span class="chip">${esc(r.note)}</span>`:''}</td><td>${esc(r.criteria)}</td>
 <td style="text-align:center">${safe(r.link)?`<a class="lnk" href="${esc(r.link)}" target="_blank" rel="noopener">فتح المسودة</a>`:''}</td>
 <td><span class="badge" style="--c:${cc(r.dept)}">${esc(dn(r.dept))}</span></td></tr>`).join('');
}
function dash(){
 if(flt!==ALL&&!depts.some(d=>d.id===flt))flt=ALL;
 return `<div class="hero"><div><h1>العصف الذهني للتوسع الدعوي للمشاريع</h1><p>تحت المجلس الإشرافي للعام ١٤٤٨ هـ</p></div></div>
 <div class="stats"><button class="stat tot" data-flt="${ALL}"><b>${tot()}</b><span>إجمالي المشاريع في كل الأقسام</span></button>
 ${depts.map(d=>`<button class="stat" style="--c:${d.c}" data-flt="${d.id}"><b>${cnt(d.id)}</b><span>${esc(d.name)}</span></button>`).join('')}</div>
 <div class="bar">${[{id:ALL,name:'كل المشاريع'},...depts].map(d=>`<button class="pill ${flt===d.id?'on':''}" data-flt="${d.id}">${esc(d.name)}</button>`).join('')}
 <input class="search" id="q" placeholder="ابحث في المشاريع…" value="${esc(q)}"></div>
 <div class="tw"><table><thead><tr><th>م</th><th style="width:34%">البيـــــــان</th><th>الملحوظة</th><th style="width:22%">معيــار النجــاح</th><th>رابط مسودة المشروع</th><th>القسم</th></tr></thead><tbody id="tb">${rowsDash()}</tbody></table></div>`;
}
function dept(id){
 const d=depts.find(x=>x.id===id);if(!d){view=ALL;return dash()}
 const l=rows.filter(r=>r.dept===id);
 const body=l.map((r,i)=>`<tr data-id="${r.id}"><td class="n">${i+1}</td>
 <td><textarea class="cell" data-f="text" rows="1" placeholder="اكتب بيان المشروع">${esc(r.text)}</textarea></td>
 <td><input class="cell" data-f="note" list="notes" value="${esc(r.note)}" placeholder="—"></td>
 <td><textarea class="cell" data-f="criteria" rows="1" placeholder="معيار النجاح">${esc(r.criteria)}</textarea></td>
 <td><input class="cell" data-f="link" dir="ltr" value="${esc(r.link)}" placeholder="https://…"></td>
 <td><button class="x" data-del="${r.id}">حذف</button></td></tr>`).join('');
 return `<div class="dh"><input class="cell dn" data-dn="${id}" value="${esc(d.name)}" style="color:${d.c}" title="اضغط لتعديل اسم القسم"><span class="badge" style="--c:${d.c}">${cnt(id)} مشروع</span>
 <button class="x" data-deld="${id}" style="margin-inline-start:auto">حذف القسم</button></div>
 <p class="hint">يمكنك تعديل اسم القسم بالضغط عليه. يُحفظ كل ما تكتبه تلقائيًا ويظهر مباشرة في لوحة المتابعة.</p>
 <div class="tw"><table><thead><tr><th>م</th><th style="width:36%">البيـــــــان</th><th>الملحوظة</th><th style="width:22%">معيــار النجــاح</th><th>رابط المسودة</th><th></th></tr></thead>
 <tbody>${body||`<tr><td colspan="6" class="empty">ابدأ بإضافة أول مشروع</td></tr>`}</tbody></table></div>
 <button class="add" data-add="${id}">+ إضافة مشروع جديد</button>
 <datalist id="notes"><option value="قصير المدى"><option value="متوسط المدى"><option value="طويل المدى"></datalist>`;
}
function render(){
 $('#app').innerHTML=side()+`<main>${view===ALL?dash():dept(view)}</main>`;
 if(!canEdit()){document.querySelectorAll('[data-f],[data-dn]').forEach(e=>e.readOnly=true);document.querySelectorAll('.add,.x,[data-newdept]').forEach(e=>e.remove());const t=$('.hint');if(t)t.textContent='وضع القراءة فقط. للتعديل اضغط «تسجيل الدخول للتحرير» وأدخل رمز التحرير (PIN).'}
}
const busy=()=>document.activeElement&&document.activeElement.matches&&document.activeElement.matches('[data-f],[data-dn]');
const WHY={pin:'رمز التحرير (PIN) غير صحيح',pin_default:'لم يتم تغيير PIN في Apps Script بعد',net:'تعذّر الاتصال بالخادم',bad:'طلب غير صالح'};
function setSt(t,bad){status=t;off=!!bad;const s=$('#stt');if(s){s.textContent=t;s.parentNode.classList.toggle('off',!!bad)}}
function persist(p){setSt('جارٍ الحفظ…');p.then(()=>setSt(GH?'تم الحفظ ✓':'تم الحفظ في المتصفح'),e=>{const c=e&&e.message;setSt('تعذّر الحفظ ('+c+'): '+(WHY[c]||'خطأ غير معروف'),1);console.error(e)})}
const save=r=>persist(store.op({op:'set',row:r}));
const T={};
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='q'){q=t.value;$('#tb').innerHTML=rowsDash();return}
 if(t.dataset&&t.dataset.dn){
  const id=t.dataset.dn,d=depts.find(x=>x.id===id),v=t.value.trim();if(!d||!v)return;
  d.name=v;const s=document.querySelector('.nav[data-view="'+id+'"] span');if(s)s.textContent=v;
  clearTimeout(T['d'+id]);T['d'+id]=setTimeout(()=>persist(store.op({op:'dept_rename',id,name:v})),DEB);return;
 }
 const f=t.dataset&&t.dataset.f;if(!f)return;
 const id=t.closest('tr').dataset.id,r=rows.find(x=>x.id===id);if(!r)return;
 r[f]=t.value;clearTimeout(T[id]);T[id]=setTimeout(()=>save(r),DEB);
});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const d=b.dataset;
 if(d.tok!==undefined){tokenToggle();return}
 if(d.view!==undefined){view=d.view;if(view===ALL)flt=ALL;render();scrollTo(0,0)}
 else if(d.flt!==undefined){flt=d.flt;render()}
 else if(d.newdept!==undefined){
  const name=(prompt('اسم القسم الجديد')||'').trim();if(!name)return;
  const n={id:'d'+Date.now().toString(36),name,c:PAL[depts.length%PAL.length]};
  depts.push(n);view=n.id;render();persist(store.op({op:'dept_add',dept:n}));scrollTo(0,0);
 }else if(d.add!==undefined){
  const r={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),dept:d.add,text:'',note:'',criteria:'',link:'',ts:Date.now()};
  rows.push(r);save(r);render();
  const a=document.querySelectorAll('textarea[data-f=text]');a[a.length-1]?.focus();
 }else if(d.deld){
  if(rows.some(r=>r.dept===d.deld)){alert('لا يمكن حذف قسم فيه مشاريع. احذف مشاريعه أولًا.');return}
  if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='تأكيد حذف القسم';setTimeout(()=>{b.classList.remove('arm');b.textContent='حذف القسم'},3000);return}
  const id=d.deld;depts=depts.filter(x=>x.id!==id);view=ALL;flt=ALL;render();
  persist(store.op({op:'dept_del',id}));
 }else if(d.del){
  if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='تأكيد الحذف';setTimeout(()=>{b.classList.remove('arm');b.textContent='حذف'},3000);return}
  const id=d.del;rows=rows.filter(x=>x.id!==id);persist(store.op({op:'del',id}));render();
 }
});
const C=window.APP_CONFIG||{},URL_=C.SCRIPT_URL||'',GH=!!URL_;
let TOKEN=localStorage.getItem('asf-pin')||'';
const canEdit=()=>!GH||!!TOKEN;
const DEB=GH?1200:500,LS='asf-dzihni-v2';
function norm(d){
 d=d&&!Array.isArray(d)?d:{rows:Array.isArray(d)?d:[]};
 d.rows=d.rows||[];if(!d.depts||!d.depts.length)d.depts=DEF.map(x=>({...x}));
 d.rows.forEach(r=>{const m=d.depts.find(x=>x.name===r.dept);if(m)r.dept=m.id});
 return d;
}
const loc=()=>{try{return norm(JSON.parse(localStorage.getItem(LS)||'null'))}catch(e){return norm(null)}};
async function call(b){
 let j;
 try{const r=await fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...b,pin:TOKEN})});j=await r.json()}
 catch(e){throw new Error('net')}
 if(!j||!j.ok)throw new Error((j&&j.error)||'net');
 return j;
}
let chain=Promise.resolve();
const queue=f=>{const run=chain.then(f);chain=run.catch(()=>{});return run};
function localOp(d,b){
 if(b.op==='set'){const i=d.rows.findIndex(x=>x.id===b.row.id);i<0?d.rows.push(b.row):d.rows[i]=b.row}
 else if(b.op==='del')d.rows=d.rows.filter(x=>x.id!==b.id);
 else if(b.op==='dept_add')d.depts.push(b.dept);
 else if(b.op==='dept_rename'){const y=d.depts.find(x=>x.id===b.id);if(y)y.name=b.name}
 else if(b.op==='dept_del')d.depts=d.depts.filter(x=>x.id!==b.id);
}
const store=GH?{
 async load(){const r=await fetch(URL_+'?action=list&t='+Date.now());return norm(await r.json())},
 op:b=>queue(()=>call(b))
}:{
 load:async()=>loc(),
 op:async b=>{const d=loc();localOp(d,b);localStorage.setItem(LS,JSON.stringify(d))}
};
async function tokenToggle(){
 if(TOKEN){TOKEN='';localStorage.removeItem('asf-pin');render();return}
 const t=(prompt('أدخل رمز التحرير (PIN)')||'').trim();if(!t)return;
 TOKEN=t;
 try{await call({op:'check'});localStorage.setItem('asf-pin',t)}
 catch(e){TOKEN='';alert(e.message==='pin'?'رمز التحرير (PIN) غير صحيح':'تعذّر الاتصال بالخادم ('+e.message+')')}
 render();
}
async function refresh(){
 try{const d=await store.load();depts=d.depts;rows=d.rows.sort((a,b)=>(a.ts||0)-(b.ts||0));off=false;status=GH?'متصل بـ Google Sheet':'تخزين محلي في هذا المتصفح فقط'}
 catch(e){off=true;status='تعذّر التحميل من Google Sheet'}
 render();
}
async function init(){render();await refresh();if(GH)setInterval(()=>{if(!busy()&&!document.hidden)refresh()},20000)}
init();
</script>
</body>
</html>
